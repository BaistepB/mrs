                  />
                </div>

              </section>
            )}

            {/* 2. Блок загрузки изображений и OCR */}
            <section className={`rounded-2xl shadow-sm border p-4 mb-4 ${t('bg-[#282B30] border-[#3A3D42]', 'bg-white border-slate-200', 'bg-white border-pink-200', 'bg-[#162032] border-[#253652]', 'bg-white border-emerald-200', 'bg-[#241C19] border-[#3E2F2A]', 'bg-white border-slate-200')}`}>
              <h2 className={`text-sm font-bold uppercase tracking-wider mb-3 ${t('text-gray-400', 'text-slate-500', 'text-pink-600', 'text-blue-300', 'text-emerald-700', 'text-[#D7B399]', 'text-slate-500')}`}>
                <span>Загрузка скриншотов заявок</span>
              </h2>

              {/* Переключатель режима источника */}
              <div className="grid grid-cols-2 gap-2 mb-3">
                <button
                  type="button"
                  onClick={() => setSourceMode('tablet')}
                  className={`min-h-[48px] px-3 py-2.5 rounded-xl font-medium text-[16px] sm:text-sm flex items-center justify-center gap-2 border transition-all ${
                    sourceMode === 'tablet'
                      ? t('bg-[#FFB300] border-[#FFB300] text-black shadow-sm', 'bg-amber-500 border-amber-600 text-white shadow-sm', 'bg-pink-500 border-pink-600 text-white shadow-sm', 'bg-sky-500 border-sky-600 text-white shadow-sm', 'bg-emerald-600 border-emerald-700 text-white shadow-sm', 'bg-[#6D4C41] border-[#5D4037] text-white shadow-sm', 'bg-[#C62828] border-[#B71C1C] text-white shadow-sm')
                      : t('bg-[#1E2125] border-gray-700 text-gray-300 hover:bg-[#33363B]', 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100', 'bg-pink-50 border-pink-200 text-pink-700 hover:bg-pink-100', 'bg-[#0B132B] border-[#253652] text-blue-200 hover:bg-[#162238]', 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100', 'bg-[#16110F] border-[#3E2F2A] text-[#D7B399] hover:bg-[#221A17]', 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100')
                  }`}
                >
                  <span>📱</span>
                  <span>Планшет</span>
                </button>

                <button
                  type="button"
                  onClick={() => setSourceMode('navision')}
                  className={`min-h-[48px] px-3 py-2.5 rounded-xl font-medium text-[16px] sm:text-sm flex items-center justify-center gap-2 border transition-all ${
                    sourceMode === 'navision'
                      ? t('bg-[#FFB300] border-[#FFB300] text-black shadow-sm', 'bg-amber-500 border-amber-600 text-white shadow-sm', 'bg-pink-500 border-pink-600 text-white shadow-sm', 'bg-sky-500 border-sky-600 text-white shadow-sm', 'bg-emerald-600 border-emerald-700 text-white shadow-sm', 'bg-[#6D4C41] border-[#5D4037] text-white shadow-sm', 'bg-[#C62828] border-[#B71C1C] text-white shadow-sm')
                      : t('bg-[#1E2125] border-gray-700 text-gray-300 hover:bg-[#33363B]', 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100', 'bg-pink-50 border-pink-200 text-pink-700 hover:bg-pink-100', 'bg-[#0B132B] border-[#253652] text-blue-200 hover:bg-[#162238]', 'bg-emerald-50 border-emerald-200 text-emerald-800 hover:bg-emerald-100', 'bg-[#16110F] border-[#3E2F2A] text-[#D7B399] hover:bg-[#221A17]', 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100')
                  }`}
                >
                  <span>💻</span>
                  <span>Navision</span>
                </button>
              </div>

              {/* Переключатель распознавания через ИИ */}
              <button
                type="button"
                onClick={() => setUseAiOcr(prev => !prev)}
                className={`w-full min-h-[44px] sm:min-h-[46px] px-3.5 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-between border transition-all mb-3 ${
                  useAiOcr
                    ? t(
                        'bg-[#FFB300]/15 border-[#FFB300]/50 text-[#FFB300]',
                        'bg-amber-50 border-amber-300 text-amber-900',
                        'bg-pink-50 border-pink-300 text-pink-700',
                        'bg-[#131D31] border-sky-500/50 text-sky-300',
                        'bg-emerald-50 border-emerald-300 text-emerald-800',
                        'bg-[#221A17] border-[#D7B399]/40 text-[#D7B399]',
                        'bg-[#FCE8E8] border-[#C62828]/40 text-[#9A1B24]'
                      )
                    : t(
                        'bg-[#1E2125] border-gray-700 text-gray-400 hover:text-gray-200',
                        'bg-slate-50 border-slate-200 text-slate-500 hover:text-slate-700',
                        'bg-pink-50/50 border-pink-200 text-pink-400 hover:text-pink-600',
                        'bg-[#0B132B] border-[#253652] text-blue-300/50 hover:text-blue-200',
                        'bg-emerald-50/50 border-emerald-200 text-emerald-600/70 hover:text-emerald-800',
                        'bg-[#16110F] border-[#3E2F2A] text-[#8D6E63] hover:text-[#D7B399]',
                        'bg-slate-50 border-slate-200 text-slate-500 hover:text-slate-700'
                      )
                }`}
                title={useAiOcr ? 'ИИ включен (авто-fallback на локальный OCR при отсутствии сети)' : 'ИИ выключен (используется только локальный Tesseract.js)'}
              >
                <div className="flex items-center gap-2">
                  <span className="text-base">✨</span>
                  <span>Распознавание ИИ</span>
                  <span className="text-xs opacity-70 font-normal hidden sm:inline">(сервер + авто-fallback)</span>
                </div>
                <div className={`w-10 h-6 flex items-center rounded-full p-1 transition-colors ${
                  useAiOcr
                    ? t('bg-[#FFB300]', 'bg-amber-500', 'bg-pink-500', 'bg-sky-500', 'bg-emerald-600', 'bg-[#8D6E63]', 'bg-[#C62828]')
                    : 'bg-gray-600'
                }`}>
                  <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform ${
                    useAiOcr ? 'translate-x-4' : 'translate-x-0'
                  }`} />
                </div>
              </button>

              {/* Drag and Drop область */}
              <div
                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                onDragLeave={() => setIsDragging(false)}
                onDrop={(e) => {
                  e.preventDefault();
                  setIsDragging(false);
                  if (e.dataTransfer.files) handleAddFiles(e.dataTransfer.files);
                }}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className={`border-2 border-dashed rounded-xl p-5 text-center cursor-pointer transition-colors ${
                  isDragging 
                    ? t('border-[#FFB300] bg-[#FFB300]/10', 'border-amber-500 bg-amber-50', 'border-pink-500 bg-pink-50', 'border-sky-400 bg-sky-950/30', 'border-emerald-500 bg-emerald-50', 'border-[#D7B399] bg-[#362924]', 'border-[#C62828] bg-rose-50') 
                    : t('border-gray-700 hover:border-gray-600 bg-[#1E2125]', 'border-slate-300 hover:border-slate-400 bg-slate-50', 'border-pink-200 hover:border-pink-300 bg-pink-50/50', 'border-[#253652] hover:border-sky-500/50 bg-[#0B132B]', 'border-emerald-200 hover:border-emerald-300 bg-emerald-50/50', 'border-[#3E2F2A] hover:border-[#6D4C41] bg-[#16110F]', 'border-slate-300 hover:border-slate-400 bg-slate-50')
                }`}

                  type="file"
                  accept="image/*"

                    e.target.value = '';

                </div>

            </section>

            <section className={`rounded-2xl shadow-sm border p-4 mb-4 ${t('bg-[#282B30] border-[#3A3D42]', 'bg-white border-slate-200', 'bg-white border-pink-200', 'bg-[#162032] border-[#253652]', 'bg-white border-emerald-200', 'bg-[#241C19] border-[#3E2F2A]', 'bg-white border-slate-200')}`}>

                    <span>Точки маршрута ({points.length})</span>
                  </h2>
                  {ocrEngineUsed && (
                    <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold border transition-colors ${

                      <path d="m21 8-4-4-4 4"/>
                      <path d="M17 4v16"/>

                  </button>
                </div>
              </div>

                  <div

                  >
                    <div className="relative flex items-center gap-1.5 sm:gap-2 flex-wrap">
                      {/* Номер точки */}
                      <div className={`w-7 h-7 rounded-full font-bold text-xs flex items-center justify-center flex-shrink-0 ${t('bg-[#FFB300] text-black', 'bg-slate-900 text-white', 'bg-pink-600 text-white', 'bg-sky-500 text-black', 'bg-emerald-700 text-white', 'bg-[#8D6E63] text-white', 'bg-[#C62828] text-white')}`}>
                        {idx + 1}
                      </div>

                      {/* Бейдж-переключатель характера заявки (М / Д / С / —) */}
                      <button
                        type="button"
                        onClick={() => handleCyclePointType(idx)}
                        className={`w-9 h-9 min-h-[36px] rounded-lg border font-bold text-xs flex items-center justify-center flex-shrink-0 transition-all ${
                          pt.type === 'М'
                            ? t(
                                'bg-blue-500/20 border-blue-400 text-blue-300 shadow-sm',
                                'bg-blue-500/15 border-blue-500 text-blue-600 shadow-sm',
                                'bg-blue-500/15 border-blue-500 text-blue-600 shadow-sm',
                                'bg-blue-500/20 border-blue-400 text-blue-300 shadow-sm',
                                'bg-blue-500/15 border-blue-500 text-blue-600 shadow-sm',
                                'bg-blue-500/20 border-blue-400 text-blue-300 shadow-sm',
                                'bg-blue-500/15 border-blue-500 text-blue-600 shadow-sm'

                            : pt.type === 'Д'
                            ? t(
                                'bg-amber-500/20 border-amber-400 text-amber-300 shadow-sm',
                                'bg-amber-500/15 border-amber-500 text-amber-700 shadow-sm',
                                'bg-amber-500/15 border-amber-500 text-amber-700 shadow-sm',
                                'bg-amber-500/20 border-amber-400 text-amber-300 shadow-sm',
                                'bg-amber-500/15 border-amber-500 text-amber-700 shadow-sm',
                                'bg-amber-500/20 border-amber-400 text-amber-300 shadow-sm',
                                'bg-amber-500/15 border-amber-500 text-amber-700 shadow-sm'
                              )
                            : pt.type === 'С'
                            ? t(
                                'bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-sm',
                                'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                'bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-sm',
                                'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                'bg-emerald-500/20 border-emerald-400 text-emerald-300 shadow-sm',
                                'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm'
                              )
                            : t(
                                'border-gray-700 bg-[#282B30] text-gray-500 hover:text-gray-300',
                                'border-slate-200 bg-white text-slate-400 hover:text-slate-600',
                                'border-pink-200 bg-white text-pink-300 hover:text-pink-600',
                                'border-[#253652] bg-[#162032] text-blue-300/40 hover:text-blue-200',
                                'border-emerald-200 bg-white text-emerald-300 hover:text-emerald-700',
                                'border-[#3E2F2A] bg-[#241C19] text-[#A1887F] hover:text-[#D7B399]',
                                'border-slate-200 bg-white text-slate-400 hover:text-slate-600'
                              )
                        }`}
                        title="Характер заявки: М (Монтаж), Д (Демонтаж/доп.), С (Сервис). Нажмите для изменения"

                      </button>

                        className={`min-h-[36px] w-[84px] sm:w-[92px] px-2 py-1 rounded-lg font-mono font-semibold text-xs sm:text-sm text-center border transition-all focus:outline-none flex-shrink-0 ${
                          pt.time
                            ? t(
                                'bg-[#FFB300]/20 border-[#FFB300]/40 text-[#FFB300] focus:border-[#FFB300]',
                                'bg-amber-100 border-amber-300 text-amber-900 focus:border-amber-500',
                                'bg-pink-100 border-pink-300 text-pink-800 focus:border-pink-500',
                                'bg-[#1E3A5F] border-sky-500/40 text-sky-300 focus:border-sky-400',
                                'bg-emerald-100 border-emerald-300 text-emerald-900 focus:border-emerald-600',
                                'bg-[#382B26] border-[#D7B399]/40 text-[#D7B399] focus:border-[#D7B399]',
                                'bg-[#FCE8E8] border-[#C62828]/30 text-[#9A1B24] focus:border-[#C62828]'
                              )
                            : t(
                                'bg-[#1E2125] border-gray-700/80 text-gray-300 placeholder:text-gray-500 focus:border-[#FFB300]',
                                'bg-slate-100 border-slate-300 text-slate-700 placeholder:text-slate-400 focus:border-amber-500',

                                'bg-[#131D31] border-[#253652] text-blue-200 placeholder:text-blue-400/50 focus:border-sky-400',
                                'bg-emerald-50 border-emerald-200 text-emerald-800 placeholder:text-emerald-400/60 focus:border-emerald-600',
                                'bg-[#221A17] border-[#3E2F2A] text-[#D7B399] placeholder:text-[#8D6E63] focus:border-[#D7B399]',
                                'bg-slate-100 border-slate-300 text-slate-700 placeholder:text-slate-400 focus:border-[#C62828]'
                              )
                        }`}
                      />

                      {/* Две кнопки-статуса: Замок (строго) и В течение дня */}
                      <div className="relative flex items-center gap-1">
                        {/* Кнопка "Строго ко времени" */}
                        <button
                          type="button"
                          onClick={() => handleToggleTimeMode(idx, 'strict')}
                          className={`w-9 h-9 min-h-[36px] rounded-lg border flex items-center justify-center transition-all ${
                            pt.timeMode === 'strict'
                              ? t(
                                  'bg-rose-500/20 border-rose-500 text-rose-400 shadow-sm',
                                  'bg-rose-500/15 border-rose-500 text-rose-600 shadow-sm',
                                  'bg-rose-500/15 border-rose-500 text-rose-600 shadow-sm',
                                  'bg-rose-500/20 border-rose-500 text-rose-400 shadow-sm',
                                  'bg-rose-500/15 border-rose-500 text-rose-600 shadow-sm',
                                  'bg-rose-500/20 border-rose-500 text-rose-400 shadow-sm',
                                  'bg-rose-500/15 border-rose-500 text-rose-600 shadow-sm'
                                )
                              : t('border-gray-700 bg-[#282B30] text-gray-400 hover:text-gray-200 hover:border-gray-600', 'border-slate-200 bg-white text-slate-400 hover:text-slate-600 hover:border-slate-300', 'border-pink-200 bg-white text-pink-300 hover:text-pink-600 hover:border-pink-300', 'border-[#253652] bg-[#162032] text-blue-300/50 hover:text-blue-200 hover:border-sky-500/40', 'border-emerald-200 bg-white text-emerald-300 hover:text-emerald-700 hover:border-emerald-300', 'border-[#3E2F2A] bg-[#241C19] text-[#A1887F] hover:text-[#D7B399] hover:border-[#6D4C41]', 'border-slate-200 bg-white text-slate-400 hover:text-slate-600 hover:border-slate-300')
                          }`}
                          title="Выполнить строго в указанное время"
                        >
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M9.5 16.5a7 7 0 1 1 6.7-9" />
                            <path d="M9.5 5.5V9.5L7 12" />
                            <path d="M16.5 10.5L22.5 21H10.5Z" />
                            <path d="M16.5 14.5v3" />
                            <circle cx="16.5" cy="19.3" r="0.6" fill="currentColor" stroke="none" />
                          </svg>
                        </button>

                        {/* Кнопка "В течение дня" */}
                        <button
                          type="button"
                          onClick={() => handleToggleTimeMode(idx, 'flexible')}
                          className={`w-9 h-9 min-h-[36px] rounded-lg border flex items-center justify-center transition-all ${
                            pt.timeMode === 'flexible'
                              ? t(
                                  'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-sm',
                                  'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                  'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                  'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-sm',
                                  'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm',
                                  'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-sm',
                                  'bg-emerald-500/15 border-emerald-500 text-emerald-700 shadow-sm'
                                )
                              : t('border-gray-700 bg-[#282B30] text-gray-400 hover:text-gray-200 hover:border-gray-600', 'border-slate-200 bg-white text-slate-400 hover:text-slate-600 hover:border-slate-300', 'border-pink-200 bg-white text-pink-300 hover:text-pink-600 hover:border-pink-300', 'border-[#253652] bg-[#162032] text-blue-300/50 hover:text-blue-200 hover:border-sky-500/40', 'border-emerald-200 bg-white text-emerald-300 hover:text-emerald-700 hover:border-emerald-300', 'border-[#3E2F2A] bg-[#241C19] text-[#A1887F] hover:text-[#D7B399] hover:border-[#6D4C41]', 'border-slate-200 bg-white text-slate-400 hover:text-slate-600 hover:border-slate-300')
                          }`}
                          title="Можно выполнить в течение дня"
                        >
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="12" cy="12" r="4.8" />
                            <path d="M12 9.5V12h2.2" />
                            <path d="M5.6 5.6A9 9 0 0 1 21 12" />
                            <path d="M19 10.5L21 12.5L22.8 10.2" />
                            <path d="M18.4 18.4A9 9 0 0 1 3 12" />
                            <path d="M1.2 13.8L3 11.5L5 13.5" />
                          </svg>
                        </button>

                        {/* Всплывающая подсказка при нажатии */}
                        {toastTooltip.id === pt.id && (
                          <div className="absolute -top-8 left-0 z-20 px-2 py-0.5 rounded-md text-[11px] font-bold shadow-md animate-fade-in bg-slate-900 text-white pointer-events-none whitespace-nowrap">
                            {toastTooltip.text}
                          </div>
                        )}
                      </div>

                      {/* Кнопки перемещения вверх / вниз / удалить */}
                      <div className="ml-auto flex items-center gap-1.5">
                        <button
                          type="button"
                          disabled={idx === 0}
                          onClick={() => handleMovePoint(idx, -1)}
                          className={`w-11 h-11 min-h-[48px] rounded-xl border disabled:opacity-30 disabled:pointer-events-none flex items-center justify-center text-base font-bold shadow-sm transition-colors ${t('bg-[#282B30] border-gray-700 text-gray-200 hover:bg-[#33363B]', 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100', 'bg-white border-pink-200 text-pink-800 hover:bg-pink-50', 'bg-[#162032] border-[#253652] text-blue-100 hover:bg-[#1E3A5F]', 'bg-white border-emerald-200 text-emerald-900 hover:bg-emerald-50', 'bg-[#241C19] border-[#3E2F2A] text-[#F5EBE6] hover:bg-[#382B26]', 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100')}`}
                          title="Поднять выше"
                        >
                          ▲
                        </button>

                        <button
                          type="button"
                          disabled={idx === points.length - 1}
                          onClick={() => handleMovePoint(idx, 1)}
                          className={`w-11 h-11 min-h-[48px] rounded-xl border disabled:opacity-30 disabled:pointer-events-none flex items-center justify-center text-base font-bold shadow-sm transition-colors ${t('bg-[#282B30] border-gray-700 text-gray-200 hover:bg-[#33363B]', 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100', 'bg-white border-pink-200 text-pink-800 hover:bg-pink-50', 'bg-[#162032] border-[#253652] text-blue-100 hover:bg-[#1E3A5F]', 'bg-white border-emerald-200 text-emerald-900 hover:bg-emerald-50', 'bg-[#241C19] border-[#3E2F2A] text-[#F5EBE6] hover:bg-[#382B26]', 'bg-white border-slate-300 text-slate-800 hover:bg-slate-100')}`}
                          title="Опустить ниже"
                        >
                          ▼
                        </button>

                        <button
                          type="button"
                          onClick={() => handleRemovePoint(idx)}
                          className={`w-11 h-11 min-h-[48px] rounded-xl border flex items-center justify-center text-base font-bold shadow-sm transition-colors ${t(
                            'bg-rose-500/15 border-rose-500/30 text-rose-400 hover:bg-rose-500/25 active:bg-rose-500/35',
                            'bg-rose-50 border-rose-200 text-rose-600 hover:bg-rose-100 active:bg-rose-200',
                            'bg-rose-50 border-rose-200 text-rose-600 hover:bg-rose-100 active:bg-rose-200',
                            'bg-rose-500/15 border-rose-500/30 text-rose-400 hover:bg-rose-500/25 active:bg-rose-500/35',
                            'bg-rose-50 border-rose-200 text-rose-600 hover:bg-rose-100 active:bg-rose-200',
                            'bg-rose-500/15 border-rose-500/30 text-rose-400 hover:bg-rose-500/25 active:bg-rose-500/35',
                            'bg-rose-50 border-rose-200 text-rose-600 hover:bg-rose-100 active:bg-rose-200'
                          )}`}
                          title="Удалить точку"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    {/* Редактируемое поле адреса */}
                    <div>
                      <input
                        type="text"
                        value={pt.address}
                        onChange={(e) => handleUpdatePointAddress(idx, e.target.value)}
                        placeholder={
                          !pt.address.trim() && (pt.type === 'М' || pt.type === 'Д')
                            ? 'Монтаж без адреса — введите адрес вручную...'
                            : !pt.address.trim()
                            ? 'Введите адрес...'
                            : 'Адрес точки...'
                        }
                        className={`w-full min-h-[48px] px-3 py-2 rounded-lg border text-[16px] sm:text-sm focus:outline-none transition-all ${
                          !pt.address.trim() && (pt.type === 'М' || pt.type === 'Д')
                            ? 'border-2 border-dashed border-amber-500/80 bg-amber-500/10 placeholder:text-amber-500/80 focus:border-amber-400 text-amber-200'
                            : !pt.address.trim()
                            ? 'border-2 border-dashed border-gray-500/50 placeholder:text-gray-400 focus:border-[#FFB300]'
                            : t('bg-[#282B30] border-gray-700 text-white focus:border-[#FFB300]', 'bg-white border-slate-300 text-slate-900 focus:border-amber-500', 'bg-white border-pink-200 text-pink-950 focus:border-pink-500', 'bg-[#162032] border-[#253652] text-blue-50 focus:border-sky-400', 'bg-white border-emerald-200 text-emerald-950 focus:border-emerald-600', 'bg-[#241C19] border-[#3E2F2A] text-[#F5EBE6] focus:border-[#D7B399]', 'bg-white border-slate-300 text-slate-900 focus:border-[#C62828]')
                        }`}
                      />
                    </div>

                    {/* Передача точки другому эксперту (только в режиме диспетчера) */}
                    {appRole === 'dispatcher' && dispatcherExperts.length > 1 && (
                      <div className={`pt-2 border-t border-dashed flex items-center justify-between gap-2 ${t('border-gray-700', 'border-slate-200', 'border-pink-200', 'border-[#253652]', 'border-emerald-200', 'border-[#3E2F2A]', 'border-slate-200')}`}>
                        <div className="flex items-center gap-1.5 text-xs opacity-75 font-semibold">
                          <span>⇄</span>
                          <span>Передать:</span>
                        </div>
                        <select
                          value=""
                          onChange={(e) => {
                            if (e.target.value) {
                              handleTransferPoint(idx, e.target.value);
                            }
                          }}
                          className={`min-h-[38px] px-2.5 py-1 rounded-lg border text-xs font-semibold focus:outline-none transition-colors ${t(
                            'bg-[#282B30] border-gray-600 text-gray-200 focus:border-blue-400',
                            'bg-slate-100 border-slate-300 text-slate-800 focus:border-blue-600',
                            'bg-pink-100 border-pink-300 text-pink-900 focus:border-pink-500',
                            'bg-[#162032] border-[#253652] text-blue-200 focus:border-sky-400',
                            'bg-emerald-100 border-emerald-300 text-emerald-900 focus:border-emerald-600',
                            'bg-[#241C19] border-[#3E2F2A] text-[#F5EBE6] focus:border-[#D7B399]',
                            'bg-slate-100 border-slate-300 text-slate-800 focus:border-blue-600'
                          )}`}
                        >
                          <option value="" disabled>Выберите эксперта...</option>
                          {dispatcherExperts.filter(e => e.id !== activeExpertId).map(e => (
                            <option key={e.id} value={e.id}>
                              {e.name} ({e.points ? e.points.length : 0} т.)
                            </option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>
                ))}
              </div>

              {/* Настройки старта и возврата */}
              <div className={`mt-5 pt-4 border-t space-y-3 ${t('border-gray-700', 'border-slate-200', 'border-pink-200', 'border-[#253652]', 'border-emerald-200', 'border-[#3E2F2A]', 'border-slate-200')}`}>
                <div className={`text-xs font-bold uppercase tracking-wider ${t('text-gray-400', 'text-slate-500', 'text-pink-600', 'text-blue-300', 'text-emerald-700', 'text-[#D7B399]', 'text-slate-500')}`}>
                  Настройки старта и финиша
                </div>

                {/* Радиокнопки выбора старта */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <label className={`min-h-[48px] px-3 py-2 rounded-xl border flex items-center gap-2 cursor-pointer transition-colors ${
                    startType === 'none' 
                      ? t('border-[#FFB300] bg-[#FFB300]/15 text-[#FFB300] font-medium', 'border-amber-500 bg-amber-50 text-amber-900 font-medium', 'border-pink-500 bg-pink-50 text-pink-900 font-medium', 'border-sky-400 bg-sky-950/40 text-sky-200 font-medium', 'border-emerald-500 bg-emerald-50 text-emerald-900 font-medium', 'border-[#D7B399] bg-[#362924] text-[#F5EBE6] font-medium', 'border-[#C62828] bg-rose-50 text-[#9A1B24] font-medium')
                      : t('border-gray-700 bg-[#1E2125] text-gray-300 hover:bg-[#33363B]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100', 'border-pink-200 bg-pink-50/50 text-pink-700 hover:bg-pink-100', 'border-[#253652] bg-[#0B132B] text-blue-200 hover:bg-[#162238]', 'border-emerald-200 bg-emerald-50/50 text-emerald-800 hover:bg-emerald-100', 'border-[#3E2F2A] bg-[#16110F] text-[#D7B399] hover:bg-[#221A17]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100')
                  }`}>
                    <input
                      type="radio"
                      name="startType"
                      checked={startType === 'none'}
                      onChange={() => setStartType('none')}
                      className="accent-amber-600"
                    />
                    <span className="text-[16px] sm:text-sm">Нет</span>
                  </label>

                  <label className={`min-h-[48px] px-3 py-2 rounded-xl border flex items-center gap-2 cursor-pointer transition-colors ${
                    startType === 'current' 
                      ? t('border-[#FFB300] bg-[#FFB300]/15 text-[#FFB300] font-medium', 'border-amber-500 bg-amber-50 text-amber-900 font-medium', 'border-pink-500 bg-pink-50 text-pink-900 font-medium', 'border-sky-400 bg-sky-950/40 text-sky-200 font-medium', 'border-emerald-500 bg-emerald-50 text-emerald-900 font-medium', 'border-[#D7B399] bg-[#362924] text-[#F5EBE6] font-medium', 'border-[#C62828] bg-rose-50 text-[#9A1B24] font-medium')
                      : t('border-gray-700 bg-[#1E2125] text-gray-300 hover:bg-[#33363B]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100', 'border-pink-200 bg-pink-50/50 text-pink-700 hover:bg-pink-100', 'border-[#253652] bg-[#0B132B] text-blue-200 hover:bg-[#162238]', 'border-emerald-200 bg-emerald-50/50 text-emerald-800 hover:bg-emerald-100', 'border-[#3E2F2A] bg-[#16110F] text-[#D7B399] hover:bg-[#221A17]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100')
                  }`}>
                    <input
                      type="radio"
                      name="startType"
                      checked={startType === 'current'}
                      onChange={() => setStartType('current')}
                      className="accent-amber-600"
                    />
                    <span className="text-[16px] sm:text-sm">Моё текущее местоположение</span>
                  </label>

                  <label className={`min-h-[48px] px-3 py-2 rounded-xl border flex items-center gap-2 cursor-pointer transition-colors ${
                    startType === 'custom' 
                      ? t('border-[#FFB300] bg-[#FFB300]/15 text-[#FFB300] font-medium', 'border-amber-500 bg-amber-50 text-amber-900 font-medium', 'border-pink-500 bg-pink-50 text-pink-900 font-medium', 'border-sky-400 bg-sky-950/40 text-sky-200 font-medium', 'border-emerald-500 bg-emerald-50 text-emerald-900 font-medium', 'border-[#D7B399] bg-[#362924] text-[#F5EBE6] font-medium', 'border-[#C62828] bg-rose-50 text-[#9A1B24] font-medium')
                      : t('border-gray-700 bg-[#1E2125] text-gray-300 hover:bg-[#33363B]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100', 'border-pink-200 bg-pink-50/50 text-pink-700 hover:bg-pink-100', 'border-[#253652] bg-[#0B132B] text-blue-200 hover:bg-[#162238]', 'border-emerald-200 bg-emerald-50/50 text-emerald-800 hover:bg-emerald-100', 'border-[#3E2F2A] bg-[#16110F] text-[#D7B399] hover:bg-[#221A17]', 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100')
                  }`}>
                    <input
                      type="radio"
                      name="startType"
                      checked={startType === 'custom'}
                      onChange={() => setStartType('custom')}
                      className="accent-amber-600"
                    />
                    <span className="text-[16px] sm:text-sm">Указать адрес старта</span>
                  </label>
                </div>

                {/* Поле ввода своего адреса старта */}
                {startType === 'custom' && (
                  <div className="mt-2">
                    <input
                      type="text"
                      value={customStart}
                      onChange={(e) => setCustomStart(e.target.value)}
                      placeholder="Введите адрес начала маршрута (например: Москва, склад)..."
                      className={`w-full min-h-[48px] px-3 py-2 rounded-lg border text-[16px] sm:text-sm focus:outline-none ${t('bg-[#282B30] border-gray-700 text-white focus:border-[#FFB300]', 'bg-white border-slate-300 text-slate-900 focus:border-amber-500', 'bg-white border-pink-200 text-pink-950 focus:border-pink-500', 'bg-[#162032] border-[#253652] text-blue-50 focus:border-sky-400', 'bg-white border-emerald-200 text-emerald-950 focus:border-emerald-600', 'bg-[#241C19] border-[#3E2F2A] text-[#F5EBE6] focus:border-[#D7B399]', 'bg-white border-slate-300 text-slate-900 focus:border-[#C62828]')}`}
                    />
                  </div>
                )}

                {/* Чекбокс возврата в точку старта (скрывается, если старт "Нет") */}
                {startType !== 'none' && (
                  <div>
                    <label className={`min-h-[48px] px-3 py-2 rounded-xl border flex items-center gap-2.5 cursor-pointer transition-colors ${t('border-gray-700 bg-[#1E2125] hover:bg-[#33363B] text-gray-200', 'border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700', 'border-pink-200 bg-pink-50/50 hover:bg-pink-100 text-pink-800', 'border-[#253652] bg-[#0B132B] hover:bg-[#162238] text-blue-100', 'border-emerald-200 bg-emerald-50/50 hover:bg-emerald-100 text-emerald-800', 'border-[#3E2F2A] bg-[#16110F] hover:bg-[#221A17] text-[#F5EBE6]', 'border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-700')}`}>
                      <input
                        type="checkbox"
                        checked={returnToStart}
                        onChange={(e) => setReturnToStart(e.target.checked)}
                        className="w-5 h-5 accent-amber-600 rounded cursor-pointer"
                      />
                      <span className="text-[16px] sm:text-sm select-none">
                        Вернуться в точку старта в конце маршрута
                      </span>
                    </label>
                  </div>
                )}
              </div>

              {/* Блок "Исходный текст распознавания" */}
              {rawOcrText && (
                <div className={`mt-4 pt-4 border-t ${t('border-gray-700', 'border-slate-200', 'border-pink-200', 'border-[#253652]', 'border-emerald-200', 'border-[#3E2F2A]', 'border-slate-200')}`}>
                  <div className="flex items-center justify-between gap-2 mb-2">
                    <button
                      type="button"
                      onClick={() => setShowRawText(!showRawText)}
                      className={`min-h-[48px] px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors flex-1 ${t('bg-[#1E2125] hover:bg-[#33363B] text-gray-200', 'bg-slate-100 hover:bg-slate-200 text-slate-800', 'bg-pink-100 hover:bg-pink-200 text-pink-800', 'bg-[#162238] hover:bg-[#1E3A5F] text-blue-100', 'bg-emerald-100 hover:bg-emerald-200 text-emerald-900', 'bg-[#221A17] hover:bg-[#382B26] text-[#F5EBE6]', 'bg-slate-100 hover:bg-slate-200 text-slate-800')}`}
                    >
                      <span>{showRawText ? '▼' : '►'}</span>
                      <span>Исходный текст распознавания ({rawOcrText.length} симв.)</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => {
                        navigator.clipboard.writeText(rawOcrText);
                        setCopiedRawText(true);
                        setTimeout(() => setCopiedRawText(false), 2000);
                      }}
                      className={`min-h-[48px] px-3 py-2 rounded-xl border text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0 ${t('border-gray-700 bg-[#1E2125] hover:bg-[#33363B] text-gray-200', 'border-slate-300 bg-white hover:bg-slate-50 text-slate-700', 'border-pink-200 bg-white hover:bg-pink-50 text-pink-700', 'border-[#253652] bg-[#162032] hover:bg-[#1E3A5F] text-blue-100', 'border-emerald-200 bg-white hover:bg-emerald-50 text-emerald-800', 'border-[#3E2F2A] bg-[#241C19] hover:bg-[#382B26] text-[#F5EBE6]', 'border-slate-300 bg-white hover:bg-slate-50 text-slate-700')}`}
                      title="Скопировать весь текст OCR"
                    >
                      <span>{copiedRawText ? '✓ Скопировано' : '📋 Копировать'}</span>
                    </button>
                  </div>

                  {showRawText && (
                    <div className="mt-2">
                      <textarea
                        readOnly
                        value={rawOcrText}
                        rows={7}
                        className={`w-full p-2.5 rounded-lg border text-[16px] sm:text-xs font-mono ${t('border-gray-700 bg-[#1E2125] text-gray-200', 'border-slate-200 bg-slate-50 text-slate-800', 'border-pink-200 bg-pink-50/50 text-pink-900', 'border-[#253652] bg-[#0B132B] text-blue-100', 'border-emerald-200 bg-emerald-50/50 text-emerald-900', 'border-[#3E2F2A] bg-[#16110F] text-[#F5EBE6]', 'border-slate-200 bg-slate-50 text-slate-800')}`}
                      />
                    </div>
                  )}
                </div>
              )}
            </section>

            {/* 4. Плавающая главная кнопка "Открыть маршрут в Яндекс Картах" */}
            <footer className={`fixed bottom-0 left-0 right-0 backdrop-blur-md border-t px-3 sm:px-4 py-2.5 z-40 transition-colors ${t('bg-[#101112]/95 border-gray-800', 'bg-white/95 border-slate-200', 'bg-white/95 border-pink-200', 'bg-[#0B132B]/95 border-[#253652]', 'bg-white/95 border-emerald-200', 'bg-[#16110F]/95 border-[#3E2F2A]', 'bg-white/95 border-slate-200')}`}>
              <div className="max-w-[680px] mx-auto">
                {appRole === 'dispatcher' ? (
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setShowMapModal(true)}
                      className="flex-1 min-h-[48px] py-3 px-2 sm:px-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-md bg-blue-600 hover:bg-blue-700 text-white active:scale-[0.99] transition-all"
                    >
                      <span>🗺️</span>
                      <span>Общая карта</span>
                      <span className="bg-white/20 text-white text-[11px] px-1.5 py-0.5 rounded-full font-extrabold">
                        {dispatcherExperts.reduce((sum, e) => sum + (e.points?.length || 0), 0)}
                      </span>
                    </button>
                    <button
                      type="button"
                      onClick={handleOpenYandexMaps}
                      disabled={points.length === 0}
                      className="flex-1 min-h-[48px] py-3 px-2 sm:px-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-md active:scale-[0.99] transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                      style={{ backgroundColor: '#FFCC00', color: '#000000' }}
                    >
                      <span>Яндекс ({activeExpert?.name || 'Эксперт'})</span>
                      <span className="bg-black/10 text-black text-[11px] px-1.5 py-0.5 rounded-full font-extrabold">
                        {points.length}
                      </span>
                    </button>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={handleOpenYandexMaps}
                    disabled={points.length === 0}
                    className="w-full min-h-[48px] py-3.5 px-4 rounded-xl font-bold text-base sm:text-lg flex items-center justify-center gap-2.5 shadow-md active:scale-[0.99] transition-all disabled:opacity-40 disabled:cursor-not-allowed"
                    style={{ backgroundColor: '#FFCC00', color: '#000000' }}
                  >
                    <span>Открыть маршрут в Яндекс Картах</span>
                    <span className="bg-black/10 text-black text-xs px-2 py-0.5 rounded-full font-extrabold ml-1">
                      {points.length} {points.length === 1 ? 'точка' : points.length >= 2 && points.length <= 4 ? 'точки' : 'точек'}
                    </span>
                  </button>
                )}
              </div>
            </footer>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
