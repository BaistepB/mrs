<body class="antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const OCR_API_URL = window.VITE_OCR_API_URL || 'https://expert-mrs.duckdns.org:8443/api/ocr-vision';

    // Сжатие скриншота перед отправкой на серверный ИИ (макс. ширина 1600px, JPEG 0.87)
    function compressImageForVision(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const tempUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(tempUrl);
          const maxDim = 1600;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          if (w > maxDim) {
            const scale = maxDim / w;
            w = maxDim;
            h = Math.round(h * scale);
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);

          canvas.toBlob((blob) => {
            resolve(blob || file);
          }, 'image/jpeg', 0.87);
        };
        img.onerror = () => {
          URL.revokeObjectURL(tempUrl);
          resolve(file);
        };
        img.src = tempUrl;
      });
    }

    // Палитра цветов для вкладок диспетчера
    const DISPATCHER_PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#4f46e5', '#059669', '#e11d48'];
    const DEFAULT_DISPATCHER_EXPERTS = [
      { id: 'exp_1', name: 'Эксперт 1', color: '#2563eb', points: [] },
      { id: 'exp_2', name: 'Эксперт 2', color: '#dc2626', points: [] },
      { id: 'exp_3', name: 'Эксперт 3', color: '#16a34a', points: [] },
      { id: 'exp_4', name: 'Эксперт 4', color: '#9333ea', points: [] }
    ];

    // Кэш геокодирования адресов (Nominatim / OSM)
    function getGeoCache() {
      try {
        const saved = localStorage.getItem('expert_route_geo_cache');
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }
    function saveGeoCache(cache) {
      try {
        localStorage.setItem('expert_route_geo_cache', JSON.stringify(cache));
      } catch (e) {}
    }

    // Геокодирование одного адреса через Nominatim с очисткой и fallback на "Москва"
    async function geocodeAddress(rawAddr, cache) {
      if (!rawAddr || !rawAddr.trim()) return null;
      const clean = rawAddr.trim();
      if (cache[clean]) return cache[clean];

      // Очистка от квартир, этажей и помещений для точности поиска OSM
      const query = clean
        .replace(/(?:кв|квартира|помещ|пом|подъезд|эт|этаж)\.?\s*\d.*$/gi, '')
        .replace(/^[,\s]+|[,\s]+$/g, '')
        .trim();

      const searchOSM = async (q) => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ru&q=${encodeURIComponent(q)}`;
          const res = await fetch(url, { headers: { 'Accept-Language': 'ru' } });
          if (!res.ok) return null;
          const list = await res.json();
          if (Array.isArray(list) && list.length > 0) {
            return { lat: parseFloat(list[0].lat), lon: parseFloat(list[0].lon) };
          }
        } catch (e) {
          console.warn('Ошибка запроса геокодирования:', q, e);
        }
        return null;
      };

      let coords = await searchOSM(query);
      if (!coords && !/(москва|обл|санкт|петербург)/i.test(query)) {
        coords = await searchOSM('Москва, ' + query);
      }

      if (coords) {
        cache[clean] = coords;
        saveGeoCache(cache);
        return coords;
      }
      return null;
    }

    function parseAddresses(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const results = [];

      for (let line of lines) {
        // 1. Расширенная проверка признаков адреса (города, округа, районы, деревни, КП, СНТ, шоссе)
        const hasAddressKeyword = /(г\.?\s*о\.?|ГО\s|р-н|район|обл\.?|область|МО,|г[.\s]|Москва|ул[.\s]|пр-кт|проспект|переулок|пер[.\s]|ш[.\s]|шоссе|бульвар|б-р|мкр[.\s]|дер[.\s]|деревня|пос[.\s]|с\.о\.|садов\.|СНТ|КП\s|уч[.\s])/i.test(line);
        if (!hasAddressKeyword) continue;

        // 2. Убираем ведущий мусор до первой кириллической буквы
        let cleaned = line.replace(/^[^А-ЯЁа-яё]+/, '');

        // 3. Восстанавливаем ! → 1 после "корп"
        cleaned = cleaned.replace(/(корп\.?)\s*!(?=[\s,]|$)/gi, '$1 1');

        // 4. Убираем телефоны (+7( или +7- или 8()
        cleaned = cleaned.replace(/,\s*[+]?[78][(-]\d[\d\s\-()]{7,}.*$/g, '');

        // 5. Убираем квартиру/помещение в конце (без \b, так как \b в JS не работает с кириллицей)
        cleaned = cleaned.replace(/,?\s*(?:^|[,\s])(кв|квартира|помещ|пом)\.?\s*\d[\dа-яёА-ЯЁ\/-]*.*$/gi, '');

        // 6. Убираем многоточие в конце обрезанных длинных адресов и чистим пробелы/запятые
        cleaned = cleaned
          .replace(/\.{2,}\s*$/, '')
          .replace(/\s*,\s*/g, ', ')
          .replace(/,+/g, ',')
          .replace(/^[,\s]+|[,\s]+$/g, '')
          .replace(/\s{2,}/g, ' ');

        // 7. Пропускаем адрес, если в нем есть цифра ИЛИ это длинный обрезанный адрес (от 25 символов)
        if (cleaned.length > 12 && (/\d/.test(cleaned) || cleaned.length > 25)) {
          results.push(cleaned);
        }
      }

      return results;
    }

    // Парсер строк Navision для извлечения адреса и времени визита
    function parseNavisionText(rawText) {
      if (!rawText) return [];
      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const results = [];

      for (let line of lines) {
        // 1. Извлечение времени визита
        let time = '';
        const timeMatch = line.match(/\b([01]?\d|2[0-3])[:;]([0-5]\d)(?::[0-5]\d)?\b/);
        if (timeMatch) {
          const hours = timeMatch[1].padStart(2, '0');
          const minutes = timeMatch[2];
          time = `${hours}:${minutes}`;
        }

        // 2. Очистка даты и времени справа
        let cleanedLine = line
          .replace(/\s+\d{1,2}\.\d{2}\.\d{2,4}.*$/g, '')
          .replace(/\s+\d{1,2}[:;]\d{2}(?::\d{2})?\s*$/g, '');

        // 3. Очистка ЗАКАЗ и номера заказа слева, а также срезанных цифр предыдущей колонки
        cleanedLine = cleanedLine
          .replace(/^[^А-ЯЁа-яёA-Za-z0-9]*ЗАКАЗ(?:[\s|.,]+|$)/i, '')
          .replace(/^(?:[A-Za-z0-9._-]+|\S*\d\S*)\s+(?=[А-ЯЁа-яё])/i, '')
          .trim();

        // 4. Прогон очищенной строки через parseAddresses
        const parsed = parseAddresses(cleanedLine);
        if (parsed && parsed.length > 0) {
          results.push({ address: parsed[0], time: time || '' });
        }
      }

      return results;
    }

    // Маска ручного ввода времени (1234 -> 12:34)
    function formatTimeInput(rawValue) {
      let digits = (rawValue || '').replace(/\D/g, '').slice(0, 4);
      if (digits.length >= 2) {
        const hours = parseInt(digits.slice(0, 2), 10);
        if (hours > 23) {
          digits = '23' + digits.slice(2);
        }
      }
      if (digits.length >= 3) {
        const firstMinDigit = parseInt(digits[2], 10);
        if (firstMinDigit > 5) {
          digits = digits.slice(0, 2) + '5' + digits.slice(3);
        }
      }
      if (digits.length > 2) {
        return digits.slice(0, 2) + ':' + digits.slice(2);
      }
      return digits;
    }

    // Вспомогательный расчет времени в минутах для сортировки
    function getTimeInMinutes(timeStr) {
      if (!timeStr) return Infinity;
      const match = String(timeStr).match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return Infinity;
      const hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      return hours * 60 + minutes;
    }

    // Сортировка массива точек по возрастанию времени (точки без времени внизу)
    function sortPointsByTime(list) {
      if (!Array.isArray(list)) return [];
      return [...list].sort((a, b) => getTimeInMinutes(a.time) - getTimeInMinutes(b.time));
    }

    // Главное приложение
    const App = () => {
      // Состояние темы оформления и модального окна настроек
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('expert_route_theme') || 'expert';
        } catch (e) {
          return 'expert';
        }
      });
      const [showSettings, setShowSettings] = useState(false);

      // Автосохранение выбранной темы
      useEffect(() => {
        try {
          localStorage.setItem('expert_route_theme', theme);
        } catch (e) {}
      }, [theme]);

      // Хелпер-функция тем оформления
      const t = (dark, light, pink, marine, mint, coffee, expert) => {
        if (theme === 'newyear') {
          return (dark || light)
            .replace(/bg-\[#101112\]/g, 'bg-[#0A1912]')
            .replace(/bg-\[#282B30\]/g, 'bg-[#11261D]')
            .replace(/bg-\[#1E2125\]/g, 'bg-[#0D1F17]')
            .replace(/hover:bg-\[#33363B\]/g, 'hover:bg-[#19382B]')
            .replace(/border-\[#3A3D42\]/g, 'border-[#1E3F30]')
            .replace(/border-gray-800/g, 'border-[#1A382A]')
            .replace(/border-gray-700/g, 'border-[#234736]')
            .replace(/border-\[#444\]/g, 'border-[#234736]')
            .replace(/bg-\[#FFB300\] text-black/g, 'bg-gradient-to-r from-[#B71C1C] to-[#D32F2F] text-white border border-[#FBBF24]/40')
            .replace(/hover:bg-\[#FFA000\]/g, 'hover:from-[#9A1B24] hover:to-[#B71C1C]')
            .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#FBBF24]/20')
            .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FBBF24]/15')
            .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828] text-white')
            .replace(/text-\[#FFB300\]/g, 'text-[#FBBF24]')
            .replace(/border-\[#FFB300\]\/50/g, 'border-[#FBBF24]/50')
            .replace(/border-\[#FFB300\]/g, 'border-[#FBBF24]')
            .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#FBBF24]')
            .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/40');
        }
        if (theme === 'expert') {
          if (expert) return expert;
          return (light || dark)
            .replace(/bg-gray-100/g, 'bg-[#F4F5F7]')
            .replace(/bg-amber-(400|500|600|700|800|900|950)/g, 'bg-[#C62828]')
            .replace(/bg-\[#FFB300\]\/15/g, 'bg-[#FCE8E8]')
            .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
            .replace(/hover:bg-amber-(500|600|700|800|900|950)/g, 'hover:bg-[#B71C1C]')
            .replace(/text-amber-\d+\/(40|50|60|70)/g, 'text-gray-500')
            .replace(/text-amber-(400|500|600|700|800|900|950)/g, 'text-[#9A1B24]')
            .replace(/text-\[#FFB300\]/g, 'text-[#9A1B24]')
            .replace(/border-amber-(500|600|700|800|900|950)/g, 'border-[#C62828]')
            .replace(/border-\[#FFB300\](\/50)?/g, 'border-[#C62828]')
            .replace(/focus:ring-amber-\d+/g, 'focus:ring-[#C62828]')
            .replace(/focus:border-amber-\d+/g, 'focus:border-[#C62828]')
            .replace(/shadow-amber-\d+\/\d+/g, 'shadow-[#C62828]/30');
        }
        if (theme === 'expert-dark') {
          if (dark && dark.includes('bg-[#FFB300]/15')) return dark;
          return (dark || light)
            .replace(/bg-\[#FFB300\] text-black/g, 'bg-[#C62828] text-white')
            .replace(/bg-\[#FFB300\]\/20/g, 'bg-[#C62828]/25')
            .replace(/bg-\[#FFB300\]/g, 'bg-[#C62828]')
            .replace(/hover:bg-\[#FFA000\]/g, 'hover:bg-[#B71C1C]')
            .replace(/text-\[#FFB300\]/g, 'text-[#FF5252]')
            .replace(/border-\[#FFB300\]\/50/g, 'border-[#EF4444]/50')
            .replace(/border-\[#FFB300\]\/30/g, 'border-[#EF4444]/30')
            .replace(/border-\[#FFB300\]/g, 'border-[#C62828]')
            .replace(/focus:ring-\[#FFB300\]/g, 'focus:ring-[#EF4444]')
            .replace(/shadow-\[#FFB300\]\/\d+/g, 'shadow-[#C62828]/30');
        }
        if (theme === 'marine') {
          return (marine || dark)
            .replace(/bg-blue-50\/50/g, 'bg-[#131D31]')
            .replace(/bg-blue-50/g, 'bg-[#0B132B]')
            .replace(/bg-blue-100/g, 'bg-[#162238]')
            .replace(/bg-blue-200/g, 'bg-[#1E3A5F]')
            .replace(/bg-white/g, 'bg-[#162032] text-blue-50')
            .replace(/text-blue-950/g, 'text-blue-50')
            .replace(/text-blue-900\/60/g, 'text-blue-300/50')
            .replace(/text-blue-900/g, 'text-blue-100')
            .replace(/text-blue-800/g, 'text-blue-200')
            .replace(/text-blue-700/g, 'text-sky-400')
            .replace(/text-blue-600/g, 'text-sky-400')
            .replace(/border-blue-200/g, 'border-[#253652]')
            .replace(/border-blue-300/g, 'border-sky-500/50');
        }
        if (theme === 'coffee') {
          return (coffee || dark)
            .replace(/bg-\[#F5F2EE\]/g, 'bg-[#16110F]')
            .replace(/bg-\[#EFEBE9\]/g, 'bg-[#221A17]')
            .replace(/bg-\[#FDFBF7\]/g, 'bg-[#241C19] text-[#F5EBE6]')
            .replace(/bg-\[#D7CCC8\]\/60/g, 'bg-[#362924]')
            .replace(/bg-\[#D7CCC8\]\/40/g, 'bg-[#362924]')
            .replace(/bg-\[#D7CCC8\]/g, 'bg-[#382B26]')
            .replace(/bg-white/g, 'bg-[#241C19] text-[#F5EBE6]')
            .replace(/text-\[#3E2723\]/g, 'text-[#F5EBE6]')
            .replace(/text-\[#4E342E\]/g, 'text-[#E6D5CC]')
            .replace(/text-\[#5D4037\]/g, 'text-[#D7B399]')
            .replace(/text-\[#6D4C41\]\/60/g, 'text-[#A1887F]/60')
            .replace(/text-\[#6D4C41\]/g, 'text-[#E0B084]')
            .replace(/text-\[#8D6E63\]/g, 'text-[#D7B399]')
            .replace(/border-\[#D7CCC8\]/g, 'border-[#3E2F2A]')
            .replace(/border-\[#A1887F\]/g, 'border-[#6D4C41]');
        }
        if (theme === 'mint') return mint;
        if (theme === 'pink') return pink;
        if (theme === 'light') return light;
        return dark;
      };

      // Синхронизация цвета фона и текста документа
      useEffect(() => {
        document.body.style.backgroundColor = theme === 'newyear' ? '#0A1912' : theme === 'expert-dark' ? '#101112' : t('#101112', '#F0F2F5', '#fdf2f8', '#0B132B', '#f0fdf4', '#16110F', '#F4F5F7');
        document.body.style.color = (theme === 'newyear' || theme === 'expert-dark') ? '#F3F4F6' : t('#F3F4F6', '#111827', '#831843', '#F0F9FF', '#14532d', '#F5EBE6', '#111827');
      }, [theme]);

      // Состояние времени
      const [now, setNow] = useState(new Date());

      // Всплывающая подсказка для кнопок статуса времени
      const [toastTooltip, setToastTooltip] = useState({ id: null, text: '' });
      const tooltipTimerRef = useRef(null);

      const showPointTooltip = (pointId, text) => {
        if (tooltipTimerRef.current) clearTimeout(tooltipTimerRef.current);
        setToastTooltip({ id: pointId, text });
        tooltipTimerRef.current = setTimeout(() => {
          setToastTooltip({ id: null, text: '' });
        }, 2000);
      };

      // Роль приложения: 'expert' (Одиночный режим) или 'dispatcher' (Режим диспетчера)
      const [appRole, setAppRole] = useState(() => {
        return localStorage.getItem('expert_route_role') || 'expert';
      });
      const appRoleRef = useRef(appRole);
      useEffect(() => {
        appRoleRef.current = appRole;
        try {
          localStorage.setItem('expert_route_role', appRole);
        } catch (e) {}
      }, [appRole]);

      // Точки одиночного режима ("Эксперт")
      const [expertPoints, setExpertPoints] = useState(() => {
        try {
          const saved = localStorage.getItem('expert_route_points');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // Список экспертов режима "Диспетчер"
      const [dispatcherExperts, setDispatcherExperts] = useState(() => {
        try {
          const saved = localStorage.getItem('expert_route_dispatcher_experts');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_DISPATCHER_EXPERTS;
      });

      // Активная вкладка эксперта в режиме диспетчера
      const [activeExpertId, setActiveExpertId] = useState(() => {
        return localStorage.getItem('expert_route_active_exp') || 'exp_1';
      });
      const activeExpertIdRef = useRef(activeExpertId);
      useEffect(() => {
        activeExpertIdRef.current = activeExpertId;
        try {
          localStorage.setItem('expert_route_active_exp', activeExpertId);
        } catch (e) {}
      }, [activeExpertId]);

      // Активный эксперт (объект)
      const activeExpert = dispatcherExperts.find(e => e.id === activeExpertId) || dispatcherExperts[0] || DEFAULT_DISPATCHER_EXPERTS[0];

      // Точки для отображения и редактирования (переключаются прозрачно в зависимости от роли)
      const points = appRole === 'dispatcher' ? (activeExpert?.points || []) : expertPoints;

      // Универсальный сеттер точек (прозрачно обновляет либо активного эксперта, либо одиночный режим)
      const setPoints = useCallback((updater) => {
        if (appRoleRef.current === 'dispatcher') {
          setDispatcherExperts(prev => {
            const curId = activeExpertIdRef.current;
            return prev.map(exp => {
              if (exp.id === curId) {
                const nextPts = typeof updater === 'function' ? updater(exp.points || []) : updater;
                return { ...exp, points: nextPts };
              }
              return exp;
            });
          });
        } else {
          setExpertPoints(updater);
        }
      }, []);

      // Состояния интерактивной карты диспетчера
      const [showMapModal, setShowMapModal] = useState(false);
      const [visibleExpertIds, setVisibleExpertIds] = useState(() => {
        return DEFAULT_DISPATCHER_EXPERTS.map(e => e.id);
      });
      const [geocodingStatus, setGeocodingStatus] = useState('');
      const [unresolvedPoints, setUnresolvedPoints] = useState([]);
      const mapInstanceRef = useRef(null);
      const mapLayersGroupRef = useRef(null);

      // Управление экспертами диспетчера
      const handleAddExpert = () => {
        setDispatcherExperts(prev => {
          const nextIndex = prev.length + 1;
          const color = DISPATCHER_PALETTE[(nextIndex - 1) % DISPATCHER_PALETTE.length];
          const newExp = {
            id: 'exp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            name: `Эксперт ${nextIndex}`,
            color,
            points: []
          };
          setActiveExpertId(newExp.id);
          setVisibleExpertIds(v => [...v, newExp.id]);
          return [...prev, newExp];
        });
      };

      const handleRemoveExpert = (expId) => {
        if (dispatcherExperts.length <= 1) {
          alert('Должен оставаться хотя бы один эксперт.');
          return;
        }
        const target = dispatcherExperts.find(e => e.id === expId);
        const name = target?.name || 'эксперта';
        if (confirm(`Удалить вкладку «${name}» и все назначенные точки?`)) {
          setDispatcherExperts(prev => {
            const nextList = prev.filter(e => e.id !== expId);
            if (activeExpertId === expId) {
              setActiveExpertId(nextList[0]?.id || 'exp_1');
            }
            return nextList;
          });
          setVisibleExpertIds(v => v.filter(id => id !== expId));
        }
      };

      const handleRenameExpert = (expId, newName) => {
        setDispatcherExperts(prev => prev.map(exp => {
          if (exp.id === expId) {
            return { ...exp, name: newName };
          }
          return exp;
        }));
      };

      const handleTransferPoint = (fromPointIndex, targetExpertId) => {
        if (!targetExpertId || targetExpertId === activeExpertId) return;
        const pointToMove = points[fromPointIndex];
        if (!pointToMove) return;

        setDispatcherExperts(prev => {
          return prev.map(exp => {
            if (exp.id === activeExpertId) {
              return { ...exp, points: (exp.points || []).filter((_, idx) => idx !== fromPointIndex) };
            }
            if (exp.id === targetExpertId) {
              const updated = sortPointsByTime([...(exp.points || []), pointToMove]);
              return { ...exp, points: updated };
            }
            return exp;
          });
        });
      };

      const toggleExpertVisibility = (expId) => {
        setVisibleExpertIds(prev =>
          prev.includes(expId) ? prev.filter(id => id !== expId) : [...prev, expId]
        );
      };

      const toggleAllExpertsVisibility = () => {
        if (visibleExpertIds.length === dispatcherExperts.length) {
          setVisibleExpertIds([]);
        } else {
          setVisibleExpertIds(dispatcherExperts.map(e => e.id));
        }
      };

      const [startType, setStartType] = useState(() => {
        return localStorage.getItem('expert_route_start_type') || 'current'; // 'current' | 'custom'
      });

      const [customStart, setCustomStart] = useState(() => {
        return localStorage.getItem('expert_route_custom_start') || '';
      });

      const [returnToStart, setReturnToStart] = useState(() => {
        return localStorage.getItem('expert_route_return') === 'true';
      });

      // Состояния скриншотов и OCR
      const [images, setImages] = useState([]);
      const [ocrLoading, setOcrLoading] = useState(false);
      const [ocrProgress, setOcrProgress] = useState(0);
      const [ocrStatusText, setOcrStatusText] = useState('');
      const [sourceMode, setSourceMode] = useState(() => {
        return localStorage.getItem('expert_route_source_mode') || 'tablet'; // 'tablet' | 'navision'
      });
      const sourceModeRef = useRef(sourceMode);
      useEffect(() => {
        sourceModeRef.current = sourceMode;
        try {
          localStorage.setItem('expert_route_source_mode', sourceMode);
        } catch (e) {}
      }, [sourceMode]);

      // Использование серверного ИИ для распознавания
      const [useAiOcr, setUseAiOcr] = useState(() => {
        const saved = localStorage.getItem('expert_route_use_ai');
        return saved === null ? true : saved === 'true';
      });
      const useAiOcrRef = useRef(useAiOcr);
      useEffect(() => {
        useAiOcrRef.current = useAiOcr;
        try {
          localStorage.setItem('expert_route_use_ai', String(useAiOcr));
        } catch (e) {}
      }, [useAiOcr]);

      // Фактически использованный движок распознавания (null | 'ai' | 'local')
      const [ocrEngineUsed, setOcrEngineUsed] = useState(null);

      const [ocrError, setOcrError] = useState('');
      const [rawOcrText, setRawOcrText] = useState('');
      const [showRawText, setShowRawText] = useState(true);
      const [copiedRawText, setCopiedRawText] = useState(false);
      const [isDragging, setIsDragging] = useState(false);

      const fileInputRef = useRef(null);

      // Предобработка скриншота на canvas под выбранный режим источника
      const preprocessImageOnCanvas = (file, mode = 'tablet') => {
        return new Promise((resolve) => {
          const img = new Image();
          const tempUrl = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(tempUrl);
            const canvas = document.createElement('canvas');
            const padding = 20;

            if (mode === 'tablet') {
              // РЕЖИМ «ПЛАНШЕТ (ЗАЯВКИ)»: обрезка краев + удаление красного + контраст серого
              const nw = img.naturalWidth;
              const nh = img.naturalHeight;

              // Обрезка по краям: левые 21%, правые 22%, верхние 15%
              const cropLeft = Math.floor(nw * 0.21);
              const cropRight = Math.floor(nw * 0.22);
              const cropW = Math.max(10, nw - cropLeft - cropRight);

              const cropTop = Math.floor(nh * 0.15);
              const cropH = Math.max(10, nh - cropTop);

              const scale = 3.0;
              const imgW = Math.round(cropW * scale);
              const imgH = Math.round(cropH * scale);
              const w = imgW + padding * 2;
              const h = imgH + padding * 2;

              canvas.width = w;
              canvas.height = h;

              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);

              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, cropLeft, cropTop, cropW, cropH, padding, padding, imgW, imgH);

              try {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];

                  // 1. Все красно-коричневые пиксели (красная строка заявки) закрашиваем в чистый белый
                  if ((r - Math.max(g, b) > 20) && r > 80) {
                    data[i] = data[i + 1] = data[i + 2] = 255;
                  } else {
                    // 2. Градации серого с мягким повышением контраста (без черных клякс)
                    const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                    const c = gray > 215 ? 255 : Math.max(0, Math.round((gray - 60) * 1.4));
                    data[i] = data[i + 1] = data[i + 2] = c;
                  }
                }

                ctx.putImageData(imgData, 0, 0);
              } catch (err) {
                console.warn('Ошибка обработки canvas tablet:', err);
              }
            } else {
              // РЕЖИМ «NAVISION (СИНИЙ ТЕКСТ)»: без обрезки краев, увеличение в 3 раза, фильтрация синего текста
              const scale = 3.0;
              const imgW = Math.round(img.naturalWidth * scale);
              const imgH = Math.round(img.naturalHeight * scale);
              const w = imgW + padding * 2;
              const h = imgH + padding * 2;

              canvas.width = w;
              canvas.height = h;

              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);

              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, padding, padding, imgW, imgH);

              try {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];

                  const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                  const minCh = Math.min(r, g, b);

                  // Стираем белый фон и бледно-серые линии сетки таблицы
                  if (gray > 205 && minCh > 195) {
                    data[i] = data[i + 1] = data[i + 2] = 255;
                  } else {
                    // Любой цветной (синий, красный, фиолетовый) и чёрный текст переводим в чёткий чёрный с сохранением сглаживания
                    const val = Math.max(0, Math.round((Math.min(gray, minCh) - 20) * 1.3));
                    data[i] = data[i + 1] = data[i + 2] = val;
                  }
                }

                ctx.putImageData(imgData, 0, 0);
              } catch (err) {
                console.warn('Ошибка обработки canvas navision:', err);
              }
            }

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/png');
          };
          img.onerror = () => {
            URL.revokeObjectURL(tempUrl);
            resolve(file);
          };
          img.src = tempUrl;
        });
      };

      // Живые часы
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Автосохранение в localStorage
      useEffect(() => {
        try {
          localStorage.setItem('expert_route_points', JSON.stringify(expertPoints));
        } catch (e) {}
      }, [expertPoints]);

      useEffect(() => {
        try {
          localStorage.setItem('expert_route_dispatcher_experts', JSON.stringify(dispatcherExperts));
        } catch (e) {}
      }, [dispatcherExperts]);

      // Инициализация и рендеринг карты Leaflet при открытии модального окна
      useEffect(() => {
        if (!showMapModal) {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
          return;
        }

        let isMounted = true;

        const initMap = async () => {
          await new Promise(r => setTimeout(r, 60));
          if (!isMounted) return;

          const container = document.getElementById('dispatcher-map-container');
          if (!container || typeof L === 'undefined') return;

          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }

          const map = L.map(container, { preferCanvas: true }).setView([55.751244, 37.618423], 10);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          }).addTo(map);

          mapInstanceRef.current = map;
          const layersGroup = L.featureGroup().addTo(map);
          mapLayersGroupRef.current = layersGroup;

          // Страховка от серых тайлов при открытии модального окна
          setTimeout(() => {
            if (isMounted && mapInstanceRef.current) {
              mapInstanceRef.current.invalidateSize();
            }
          }, 150);

          const geoCache = getGeoCache();
          const unresolved = [];
          const expertsToRender = dispatcherExperts.filter(e => visibleExpertIds.includes(e.id));

          const uncachedAddrs = new Set();
          for (const exp of expertsToRender) {
            for (const pt of (exp.points || [])) {
              if (pt.address && pt.address.trim() && !geoCache[pt.address.trim()]) {
                uncachedAddrs.add(pt.address.trim());
              }
            }
          }

          let progressCount = 0;
          const totalToFetch = uncachedAddrs.size;

          for (const exp of expertsToRender) {
            if (!isMounted) return;
            const validPointsWithCoords = [];

            for (let pIdx = 0; pIdx < (exp.points || []).length; pIdx++) {
              if (!isMounted) return;
              const pt = exp.points[pIdx];
              if (!pt.address || !pt.address.trim()) {
                unresolved.push({ expertName: exp.name, color: exp.color, point: pt, reason: 'Нет адреса (монтаж)' });
                continue;
              }

              const cleanAddr = pt.address.trim();
              let coords = geoCache[cleanAddr];

              if (!coords) {
                progressCount++;
                setGeocodingStatus(`Поиск координат (${progressCount} из ${totalToFetch}): ${cleanAddr.substring(0, 30)}...`);
                coords = await geocodeAddress(cleanAddr, geoCache);
                await new Promise(r => setTimeout(r, 1100));
              }

              if (coords) {
                validPointsWithCoords.push({ pt, coords, pIdx });
              } else {
                unresolved.push({ expertName: exp.name, color: exp.color, point: pt, reason: 'Адрес не найден' });
              }
            }

            if (!isMounted) return;

            validPointsWithCoords.forEach(({ pt, coords, pIdx }) => {
              const markerHtml = `
                <div style="background-color: ${exp.color}; width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.45); border: 2px solid white;">
                  <span style="transform: rotate(45deg); color: white; font-size: 11px; font-weight: 800; font-family: sans-serif;">${pIdx + 1}</span>
                </div>
              `;
              const icon = L.divIcon({
                className: '',
                html: markerHtml,
                iconSize: [28, 28],
                iconAnchor: [14, 28],
                popupAnchor: [0, -28]
              });

              const popupContent = `
                <div style="min-width: 170px; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.4;">
                  <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-weight: bold; color: ${exp.color};">
                    <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: ${exp.color};"></span>
                    <span>${exp.name} &bull; Точка #${pIdx + 1}</span>
                  </div>
                  ${pt.type ? `<div style="font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #4b5563;">Тип заявки: ${pt.type === 'М' ? 'Монтаж' : pt.type === 'Д' ? 'Демонтаж' : 'Сервис'}</div>` : ''}
                  ${pt.time ? `<div style="font-weight: bold; margin-bottom: 4px;">Время: ${pt.time} ${pt.timeMode === 'strict' ? '⚠️ (строго)' : pt.timeMode === 'flexible' ? '🕒 (в течение дня)' : ''}</div>` : ''}
                  <div style="color: #1f2937; word-break: break-word;">${pt.address}</div>
                </div>
              `;

              const marker = L.marker([coords.lat, coords.lon], { icon }).bindPopup(popupContent);
              marker.addTo(layersGroup);
            });

            // Маршрут по дорогам через OSRM
            if (validPointsWithCoords.length >= 2) {
              try {
                const coordsStr = validPointsWithCoords.map(item => `${item.coords.lon},${item.coords.lat}`).join(';');
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`;
                const res = await fetch(osrmUrl);
                if (res.ok) {
                  const osrmData = await res.json();
                  if (isMounted && osrmData?.routes?.[0]?.geometry) {
                    L.geoJSON(osrmData.routes[0].geometry, {
                      style: { color: exp.color, weight: 4, opacity: 0.85, lineJoin: 'round' }
                    }).addTo(layersGroup);
                  }
                } else {
                  throw new Error('OSRM error');
                }
              } catch (routeErr) {
                if (isMounted) {
                  const latLngs = validPointsWithCoords.map(item => [item.coords.lat, item.coords.lon]);
                  L.polyline(latLngs, {
                    color: exp.color,
                    weight: 3,
                    opacity: 0.7,
                    dashArray: '6, 8'
                  }).addTo(layersGroup);
                }
              }
            }
          }

          if (!isMounted) return;

          setUnresolvedPoints(unresolved);
          setGeocodingStatus('');

          if (layersGroup.getLayers().length > 0) {
            map.fitBounds(layersGroup.getBounds().pad(0.15));
          }
          setTimeout(() => {
            if (isMounted && mapInstanceRef.current) {
              mapInstanceRef.current.invalidateSize();
            }
          }, 150);
        };

        initMap();

        return () => {
          isMounted = false;
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, [showMapModal, visibleExpertIds]);

      useEffect(() => {
        try {
          localStorage.setItem('expert_route_start_type', startType);
          localStorage.setItem('expert_route_custom_start', customStart);
          localStorage.setItem('expert_route_return', returnToStart ? 'true' : 'false');
        } catch (e) {}
      }, [startType, customStart, returnToStart]);

      // Предобработка левой колонки со временем (только для режима tablet)
      const preprocessTimeColumnOnCanvas = (file) => {
        return new Promise((resolve) => {
          const img = new Image();
          const tempUrl = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(tempUrl);
            const canvas = document.createElement('canvas');
            const padding = 20;

            const nw = img.naturalWidth;
            const nh = img.naturalHeight;

            // Те же параметры Y, что и в tablet-фильтре:
            const cropTop = Math.floor(nh * 0.15);
            const cropH = Math.max(10, nh - cropTop);

            // По горизонтали: левая колонка от 4% до 21% ширины (ширина 17%)
            const cropLeft = Math.floor(nw * 0.04);
            const cropW = Math.max(10, Math.floor(nw * 0.17));

            const scale = 3.0;
            const imgW = Math.round(cropW * scale);
            const imgH = Math.round(cropH * scale);
            const w = imgW + padding * 2;
            const h = imgH + padding * 2;

            canvas.width = w;
            canvas.height = h;

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, cropLeft, cropTop, cropW, cropH, padding, padding, imgW, imgH);

            try {
              const imgData = ctx.getImageData(0, 0, w, h);
              const data = imgData.data;

              for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Контрастные градации серого: темный текст времени на белом фоне
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                const c = gray > 180 ? 255 : Math.max(0, Math.round((gray - 50) * 1.5));
                data[i] = data[i + 1] = data[i + 2] = c;
              }

              ctx.putImageData(imgData, 0, 0);
            } catch (err) {
              console.warn('Ошибка обработки canvas time column:', err);
            }

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/png');
          };
          img.onerror = () => {
            URL.revokeObjectURL(tempUrl);
            resolve(file);
          };
          img.src = tempUrl;
        });
      };

      // Обработка распознавания через Tesseract.js (прямой вызов recognize)
      const processImagesOCR = async (imageFiles) => {
        if (!imageFiles || imageFiles.length === 0) return;
        setOcrLoading(true);
        setOcrProgress(0);
        setOcrError('');
        setOcrStatusText('Подготовка распознавания...');

        let combinedText = rawOcrText ? rawOcrText + '\n\n' : '';
        const allNewPoints = [];

        try {
          for (let idx = 0; idx < imageFiles.length; idx++) {
            const file = imageFiles[idx];
            let photoProcessedWithAi = false;
            const currentMode = sourceModeRef.current || 'tablet';
            const shouldTryAi = useAiOcrRef.current && (typeof navigator === 'undefined' || navigator.onLine !== false);

            // ЭТАП 1: Попытка распознавания через серверный ИИ
            if (shouldTryAi) {
              setOcrStatusText(`Распознавание ИИ (фото ${idx + 1} из ${imageFiles.length})...`);
              try {
                const compressedBlob = await compressImageForVision(file);
                const formData = new FormData();
                formData.append('image', compressedBlob, file.name ? file.name.replace(/\.[^.]+$/, '.jpg') : 'screenshot.jpg');

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 28000);

                const response = await fetch(OCR_API_URL, {
                  method: 'POST',
                  body: formData,
                  signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                  const data = await response.json();
                  if (data && Array.isArray(data.items) && data.items.length > 0) {
                    let aiPhotoText = `--- Фото ${idx + 1} (ИИ) ---\n`;
                    for (const item of data.items) {
                      const addr = (item.address || '').trim();
                      const tVal = (item.time || '').trim();
                      const typeVal = (item.type || '').trim();
                      if (addr) {
                        allNewPoints.push({ address: addr, time: tVal, type: typeVal });
                        aiPhotoText += (typeVal ? `[${typeVal}] ` : '') + (tVal ? `[${tVal}] ` : '') + addr + '\n';
                      } else if (typeVal === 'М' || typeVal === 'Д') {
                        // Монтажная заявка без адреса (колонка пустая)
                        allNewPoints.push({ address: '', time: tVal, type: typeVal });
                        aiPhotoText += `[${typeVal}] ` + (tVal ? `[${tVal}] ` : '') + 'Монтаж без адреса\n';
                      }
                    }
                    combinedText += aiPhotoText + '\n';
                    setOcrEngineUsed('ai');
                    photoProcessedWithAi = true;
                  }
                }
              } catch (aiErr) {
                console.warn(`ИИ-распознавание для фото ${idx + 1} не удалось, переключение на локальный OCR:`, aiErr);
              }
            }

            // ЭТАП 2: Резервный метод (Fallback на локальный Tesseract.js)
            if (!photoProcessedWithAi) {
              setOcrEngineUsed(prev => prev === 'ai' ? 'ai' : 'local');
              setOcrStatusText(`Обработка фото ${idx + 1} (${currentMode === 'tablet' ? 'Планшет' : 'Navision'})...`);
              const filteredBlob = await preprocessImageOnCanvas(file, currentMode);

            setOcrStatusText(`Распознавание адресов (фото ${idx + 1} из ${imageFiles.length})...`);
            const imageUrl = URL.createObjectURL(filteredBlob);

            let ocrResult = null;
            try {
              ocrResult = await Tesseract.recognize(imageUrl, 'rus', {
                langPath: 'https://tessdata.projectnaptha.com/4.0.0_best',
                logger: m => {
                  if (m.status === 'recognizing text') {
                    const p = Math.round((m.progress || 0) * 100);
                    setOcrProgress(p);
                    setOcrStatusText(`Распознавание: ${p}%`);
                  } else if (m.status) {
                    setOcrStatusText(m.status);
                  }
                }
              });
            } finally {
              URL.revokeObjectURL(imageUrl);
            }

            const recognizedText = ocrResult?.data?.text || '';
            const photoBlock = `--- Фото ${idx + 1} (Локальный OCR) ---\n` + recognizedText + '\n';
            combinedText += photoBlock;

            if (currentMode === 'tablet') {
              // РЕЖИМ ПЛАНШЕТ: парсим адреса с Y-координатами и запускаем Проход 2 (распознавание времени)
              const addrItems = [];
              const lines = ocrResult?.data?.lines || [];

              if (lines.length > 0) {
                for (const line of lines) {
                  const lineText = line.text || '';
                  const parsed = parseAddresses(lineText);
                  if (parsed && parsed.length > 0) {
                    const y = line.bbox ? (line.bbox.y0 + line.bbox.y1) / 2 : null;
                    for (const addr of parsed) {
                      addrItems.push({ address: addr, y });
                    }
                  }
                }
              }

              // Запасной вариант: если lines пуст или не дал адресов, парсим через общий text
              if (addrItems.length === 0) {
                const fallbackAddrs = parseAddresses(recognizedText);
                for (const addr of fallbackAddrs) {
                  addrItems.push({ address: addr, y: null });
                }
              }

              if (addrItems.length > 0) {
                // Проход 2: Распознавание колонки со временем
                setOcrStatusText(`Распознавание времени (фото ${idx + 1} из ${imageFiles.length})...`);
                const timeBlob = await preprocessTimeColumnOnCanvas(file);
                const timeImageUrl = URL.createObjectURL(timeBlob);

                const timeItems = [];
                try {
                  const timeResult = await Tesseract.recognize(timeImageUrl, 'rus', {
                    langPath: 'https://tessdata.projectnaptha.com/4.0.0_best',
                    logger: m => {
                      if (m.status === 'recognizing text') {
                        const p = Math.round((m.progress || 0) * 100);
                        setOcrProgress(p);
                        setOcrStatusText(`Время: ${p}%`);
                      }
                    }
                  });

                  const timeLines = timeResult?.data?.lines || [];
                  for (const tLine of timeLines) {
                    const rawLine = tLine.text || '';
                    // Удаляем дату (например: 19.11.2026 или 19.11.26), чтобы не путать со временем
                    const withoutDate = rawLine.replace(/\d{2}\.\d{2}\.\d{2,4}/g, '');
                    const timeMatch = withoutDate.match(/\b([01]?\d|2[0-3])[:;]([0-5]\d)\b/);
                    if (timeMatch) {
                      const h = timeMatch[1].padStart(2, '0');
                      const m = timeMatch[2];
                      const timeStr = `${h}:${m}`;
                      const y = tLine.bbox ? (tLine.bbox.y0 + tLine.bbox.y1) / 2 : null;
                      timeItems.push({ time: timeStr, y });
                    }
                  }
                } catch (timeErr) {
                  console.warn('Ошибка распознавания времени:', timeErr);
                } finally {
                  URL.revokeObjectURL(timeImageUrl);
                }

                // Геометрическое сопоставление времени с адресами по оси Y
                const usedTimeIndices = new Set();
                for (const addrItem of addrItems) {
                  let matchedTime = '';
                  if (addrItem.y !== null && timeItems.length > 0) {
                    let minDiff = 350; // Порог не более 350 пикселей на масштабе 3x
                    let bestIdx = -1;
                    for (let tIdx = 0; tIdx < timeItems.length; tIdx++) {
                      if (!usedTimeIndices.has(tIdx) && timeItems[tIdx].y !== null) {
                        const diff = Math.abs(timeItems[tIdx].y - addrItem.y);
                        if (diff < minDiff) {
                          minDiff = diff;
                          bestIdx = tIdx;
                        }
                      }
                    }
                    if (bestIdx !== -1) {
                      matchedTime = timeItems[bestIdx].time;
                      usedTimeIndices.add(bestIdx);
                    }
                  }
                  allNewPoints.push({ address: addrItem.address, time: matchedTime });
                }
              }
            } else {
              // РЕЖИМ NAVISION: парсим строки через parseNavisionText (адрес + время)
              const navPoints = parseNavisionText(recognizedText);
              if (navPoints.length > 0) {
                for (const pt of navPoints) {
                  allNewPoints.push(pt);
                }
              } else {
                // Запасной вариант при сбое построчного разбора
                const fallbackAddrs = parseAddresses(recognizedText);
                for (const addr of fallbackAddrs) {
                  allNewPoints.push({ address: addr, time: '' });
                }
              }
            }
          }
        }

          setRawOcrText(combinedText);

          if (allNewPoints.length > 0) {
            const normalize = s => s.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
            setPoints(prev => {
              const seenKeys = new Set(prev.map(p => normalize(p.address)).filter(Boolean));
              const uniqueNewPoints = [];
              for (const item of allNewPoints) {
                // Монтажные заявки без адреса добавляем каждую отдельно без объединения
                if (!item.address && (item.type === 'М' || item.type === 'Д')) {
                  uniqueNewPoints.push({
                    id: 'point_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    type: item.type,
                    address: '',
                    time: item.time || '',
                    timeMode: null
                  });
                  continue;
                }

                const key = normalize(item.address);
                if (key && !seenKeys.has(key)) {
                  seenKeys.add(key);
                  uniqueNewPoints.push({
                    id: 'point_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                    type: item.type || '',
                    address: item.address,
                    time: item.time || '',
                    timeMode: null
                  });
                }
              }
              const combined = [...prev, ...uniqueNewPoints];
              return sortPointsByTime(combined);
            });
          }
        } catch (err) {
          console.error('Ошибка OCR:', err);
          setOcrError(err.message || String(err));
        } finally {
          setOcrLoading(false);
          setOcrProgress(0);
          setOcrStatusText('');
        }
      };

      // Добавление новых изображений
      const handleAddFiles = (files) => {
        const fileArr = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (fileArr.length === 0) return;

        const newImgs = fileArr.map(file => ({
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          file,
          previewUrl: URL.createObjectURL(file)
        }));

        setImages(prev => [...prev, ...newImgs]);
        processImagesOCR(fileArr);
      };

      // Удаление одной картинки
      const handleRemoveImage = (id) => {
        setImages(prev => {
          const target = prev.find(img => img.id === id);
          if (target && target.previewUrl) {
            URL.revokeObjectURL(target.previewUrl);
          }
          return prev.filter(img => img.id !== id);
        });
      };

      // Глобальный перехват Paste (вставка из буфера)
      useEffect(() => {
        const handlePaste = (e) => {
          // Если фокус в текстовом поле, даем вставить обычный текст
          if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
            return;
          }
          if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
            const imgFiles = Array.from(e.clipboardData.files).filter(f => f.type.startsWith('image/'));
            if (imgFiles.length > 0) {
              e.preventDefault();
              handleAddFiles(imgFiles);
            }
          }
        };

        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [rawOcrText]);

      // Кнопка вставки из буфера обмена через API
      const handlePasteFromClipboardBtn = async () => {
        try {
          if (!navigator.clipboard || !navigator.clipboard.read) {
            alert('Прямой доступ к буферу не поддерживается вашим браузером. Нажмите Ctrl+V или вставьте фото долгим тапом.');
            return;
          }
          const clipboardItems = await navigator.clipboard.read();
          const imageFiles = [];
          for (const item of clipboardItems) {
            const imageType = item.types.find(type => type.startsWith('image/'));
            if (imageType) {
              const blob = await item.getType(imageType);
              const file = new File([blob], `clipboard-${Date.now()}.png`, { type: imageType });
              imageFiles.push(file);
            }
          }
          if (imageFiles.length > 0) {
            handleAddFiles(imageFiles);
          } else {
            alert('В буфере обмена нет изображения. Скопируйте скриншот и повторите попытку.');
          }
        } catch (err) {
          alert('Для вставки из буфера разрешите доступ к буферу обмена или используйте сочетание клавиш Ctrl+V.');
        }
      };

      // Кнопка "Новый день" (сброс)
      const handleNewDay = () => {
        if (appRole === 'dispatcher') {
          const action = confirm(
            `Очистить только текущую вкладку «${activeExpert.name}»?\n\nНажмите «ОК», чтобы очистить заявки «${activeExpert.name}».\nНажмите «Отмена», чтобы выбрать сброс всех экспертов или отказаться.`
          );
          if (action) {
            images.forEach(img => {
              if (img.previewUrl) URL.revokeObjectURL(img.previewUrl);
            });
            setImages([]);
            setPoints([]);
            setRawOcrText('');
            setOcrError('');
            setShowRawText(false);
            setOcrEngineUsed(null);
          } else {
            if (confirm('Сбросить ВСЕХ экспертов и начать абсолютно новый день?')) {
              images.forEach(img => {
                if (img.previewUrl) URL.revokeObjectURL(img.previewUrl);
              });
              setImages([]);
              setDispatcherExperts(DEFAULT_DISPATCHER_EXPERTS);
              setActiveExpertId('exp_1');
              setRawOcrText('');
              setOcrError('');
              setShowRawText(false);
              setOcrEngineUsed(null);
              localStorage.removeItem('expert_route_dispatcher_experts');
            }
          }
        } else {
          if (confirm('Начать новый день? Все загруженные скриншоты и список точек маршрута будут очищены.')) {
            images.forEach(img => {
              if (img.previewUrl) URL.revokeObjectURL(img.previewUrl);
            });
            setImages([]);
            setPoints([]);
            setRawOcrText('');
            setOcrError('');
            setShowRawText(false);
            setOcrEngineUsed(null);
            localStorage.removeItem('expert_route_points');
          }
        }
      };

      // Управление точками маршрута
      const handleMovePoint = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= points.length) return;
        setPoints(prev => {
          const updated = [...prev];
          const temp = updated[index];
          updated[index] = updated[targetIndex];
          updated[targetIndex] = temp;
          return updated;
        });
      };

      const handleRemovePoint = (index) => {
        setPoints(prev => prev.filter((_, i) => i !== index));
      };

      const handleUpdatePointAddress = (index, newAddress) => {
        setPoints(prev => {
          const updated = [...prev];
          updated[index] = { ...updated[index], address: newAddress };
          return updated;
        });
      };

      const handleUpdatePointTime = (index, rawValue) => {
        const formatted = formatTimeInput(rawValue);
        setPoints(prev => {
          const updated = [...prev];
          updated[index] = { ...updated[index], time: formatted };
          return updated;
        });
      };

      const handleToggleTimeMode = (index, mode) => {
        setPoints(prev => {
          const updated = [...prev];
          const currentMode = updated[index]?.timeMode;
          const newMode = currentMode === mode ? null : mode;
          updated[index] = { ...updated[index], timeMode: newMode };

          const tooltipText = newMode === 'strict'
            ? 'Строго ко времени'
            : newMode === 'flexible'
              ? 'В течение дня'
              : 'Режим снят';
          showPointTooltip(updated[index].id, tooltipText);

          return updated;
        });
      };

      // Циклическое переключение характера заявки ('' -> 'М' -> 'Д' -> 'С' -> '')
      const handleCyclePointType = (index) => {
        const types = ['', 'М', 'Д', 'С'];
        setPoints(prev => {
          const updated = [...prev];
          if (!updated[index]) return prev;
          const currentType = updated[index].type || '';
          const nextIdx = (types.indexOf(currentType) + 1) % types.length;
          updated[index] = {
            ...updated[index],
            type: types[nextIdx]
          };
          return updated;
        });
      };

      const handleAddManualPoint = () => {
        setPoints(prev => [
          ...prev,
          {
            id: 'point_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            type: '',
            address: '',
            time: '',
            timeMode: null
          }
        ]);
      };

      // Формирование ссылки Яндекс Карт
      const handleOpenYandexMaps = () => {
        if (points.length === 0) {
          alert('Маршрут пуст. Добавьте или распознайте адреса точек.');
          return;
        }

        // Проверяем валидность адресов
        const validPoints = points.filter(p => p.address && p.address.trim().length > 0);
        if (validPoints.length === 0) {
          alert('Пожалуйста, заполните адреса точек маршрута.');
          return;
        }

        const segments = [];

        // 1. Точка старта (если не 'none')
        if (startType === 'custom') {
          if (!customStart.trim()) {
            alert('Укажите адрес точки старта или выберите другой вариант старта.');
            return;
          }
          segments.push(encodeURIComponent(customStart.trim()));
        } else if (startType === 'current') {
          // Пустой сегмент для текущего местоположения
          segments.push('');
        }
        // Если startType === 'none', массив строится строго от первой точки

        // 2. Промежуточные точки
        validPoints.forEach(p => {
          segments.push(encodeURIComponent(p.address.trim()));
        });

        // 3. Возврат в точку старта (только если не 'none')
        if (returnToStart && startType !== 'none') {
          if (startType === 'custom') {
            segments.push(encodeURIComponent(customStart.trim()));
          } else if (startType === 'current') {
            segments.push('');
          }
        }

        const rtextValue = segments.join('~');
        const routeQuery = `rtext=${rtextValue}&rtt=auto`;
        const webUrl = `https://yandex.ru/maps/?${routeQuery}`;
        const yandexMapsAppUrl = `yandexmaps://maps.yandex.ru/?${routeQuery}`;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isIOS) {
          // На iOS открываем напрямую приложение Яндекс Карт, чтобы Яндекс Навигатор не перехватывал ссылку
          window.location.href = yandexMapsAppUrl;

          // Резервный переход на веб-версию, если приложение Яндекс Карт не установлено
          setTimeout(() => {
            if (!document.hidden) {
              window.location.href = webUrl;
            }
          }, 1500);
        } else {
          // Для десктопа и Android сохраняем открытие в новой вкладке
          window.open(webUrl, '_blank');
        }
      };

      // Форматирование даты и времени для шапки
      const formatDate = (date) => {
        const d = String(date.getDate()).padStart(2, '0');
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const y = date.getFullYear();
        return `${d}.${m}.${y}`;
      };

      const formatTime = (date) => {
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        return `${h}:${min}:${s}`;
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${(theme === 'expert-dark' || theme === 'dark') ? 'bg-[#101112] text-gray-100' : theme === 'newyear' ? 'bg-[#0A1912] text-gray-100' : t('bg-[#101112] text-gray-100', 'bg-[#F0F2F5] text-gray-900', 'bg-pink-50 text-pink-950', 'bg-[#0B132B] text-blue-50', 'bg-emerald-50 text-emerald-950', 'bg-[#16110F] text-[#F5EBE6]', 'bg-[#F4F5F7] text-gray-900')}`}>
          
          {/* Снегопад для темы "Новогодняя" */}
          {theme === 'newyear' && (
            <div className="fixed inset-0 pointer-events-none overflow-hidden z-40">
              {[
                { left: '5%', dur: '9s', delay: '0s', size: '12px' },
                { left: '15%', dur: '12s', delay: '2s', size: '16px' },
                { left: '25%', dur: '10s', delay: '4s', size: '10px' },
                { left: '35%', dur: '14s', delay: '1s', size: '14px' },
                { left: '48%', dur: '11s', delay: '3s', size: '12px' },
                { left: '60%', dur: '13s', delay: '5s', size: '15px' },
                { left: '72%', dur: '9.5s', delay: '1.5s', size: '11px' },
                { left: '83%', dur: '12.5s', delay: '3.5s', size: '16px' },
                { left: '92%', dur: '10.5s', delay: '0.5s', size: '13px' }
              ].map((s, idx) => (
                <span 
                  key={idx} 
                  className="snowflake" 
                  style={{ left: s.left, animationDuration: s.dur, animationDelay: s.delay, fontSize: s.size }}
                >
                  ❄
                </span>
              ))}
            </div>
          )}

          {/* Модальное окно настроек */}
          {showSettings && (
            <div 
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in"
              onClick={() => setShowSettings(false)}
            >
              <div 
                className={`w-full max-w-sm rounded-2xl border-2 ${t('bg-[#282B30] border-[#FFB300]', 'bg-white border-amber-900', 'bg-white border-pink-400', 'bg-white border-blue-600', 'bg-white border-emerald-600', 'bg-white border-[#8D6E63]', 'bg-white border-[#C62828]')} p-5 shadow-2xl`}
                onClick={e => e.stopPropagation()}
              >
                <div className="flex items-center justify-between mb-4">
                  <h3 className={`text-base font-black tracking-widest ${t('text-[#FFB300]', 'text-amber-900', 'text-pink-600', 'text-blue-600', 'text-emerald-700', 'text-[#5D4037]', 'text-[#9A1B24]')}`}>
                    НАСТРОЙКИ
                  </h3>
                  <button 
                    type="button"
                    onClick={() => setShowSettings(false)} 
                    className="p-1 opacity-70 hover:opacity-100 text-lg font-bold min-h-[44px] min-w-[44px] flex items-center justify-center"
                    title="Закрыть"
                  >
                    ✕
                  </button>
                </div>

                <div className={`p-3 rounded-xl border flex justify-between items-center mb-4 ${t('bg-[#1E2125] border-gray-700', 'bg-gray-50 border-gray-300', 'bg-pink-100 border-pink-200', 'bg-blue-100 border-blue-200', 'bg-emerald-100 border-emerald-200', 'bg-[#EFEBE9] border-[#D7CCC8]', 'bg-[#F4F5F7] border-gray-200')}`}>
                  <span className="text-sm font-bold">Тема оформления</span>
                  <button 
                    type="button"
                    onClick={() => {
                      const themes = ['expert', 'expert-dark', 'newyear', 'dark', 'light', 'marine', 'coffee', 'pink', 'mint'];
                      const nextIdx = (themes.indexOf(theme) + 1) % themes.length;
                      setTheme(themes[nextIdx]);
                    }} 
                    className={`min-h-[44px] px-3.5 py-1.5 rounded-lg text-xs font-black flex items-center gap-1.5 transition-all ${
                      theme === 'expert' ? 'bg-[#D32F2F] text-white shadow-sm' : 
                      theme === 'expert-dark' ? 'bg-[#75161F] text-white border border-[#FF5252]/40 shadow-sm' : 
                      theme === 'newyear' ? 'bg-gradient-to-r from-[#0F291E] to-[#991B1B] text-[#FBBF24] border border-[#FBBF24]/50 shadow-sm' : 
                      t('bg-[#FFB300] text-black', 'bg-black text-white', 'bg-pink-500 text-white', 'bg-blue-600 text-white', 'bg-emerald-600 text-white', 'bg-[#6D4C41] text-white', 'bg-[#C62828] text-white')
                    }`}
                  >
                    <span>🎨</span>
                    <span>
                      {theme === 'expert' ? 'ЭКСПЕРТ' : 
                       theme === 'expert-dark' ? 'ЭКСПЕРТ НОЧЬ' : 
                       theme === 'newyear' ? '🎄 НОВОГОДНЯЯ' : 
                       theme === 'dark' ? 'ТЕМНАЯ' : 
                       theme === 'light' ? 'СВЕТЛАЯ' : 
                       theme === 'marine' ? 'МОРСКАЯ' : 
                       theme === 'coffee' ? 'КОФЕЙНАЯ' : 
                       theme === 'pink' ? 'РОЗОВАЯ' : 'МЯТНАЯ'}
                    </span>
                  </button>
                </div>

                <div className="mt-4 flex justify-end">
                  <button 
                    type="button"
                    onClick={() => setShowSettings(false)} 
                    className={`min-h-[48px] px-6 py-2 text-sm font-bold rounded-xl transition-all ${t('bg-[#FFB300] text-black hover:bg-[#FFA000]', 'bg-amber-600 text-white hover:bg-amber-700', 'bg-pink-500 text-white hover:bg-pink-600', 'bg-blue-600 text-white hover:bg-blue-700', 'bg-emerald-600 text-white hover:bg-emerald-700', 'bg-[#6D4C41] text-white hover:bg-[#5D4037]', 'bg-[#C62828] text-white hover:bg-[#B71C1C]')}`}
                  >
                    ЗАКРЫТЬ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Модальное окно: Интерактивная карта пересечений диспетчера (Leaflet + OSM + OSRM) */}
          {showMapModal && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-sm animate-fade-in"
              onClick={() => setShowMapModal(false)}
            >
              <div
                className={`w-full max-w-5xl h-[92vh] max-h-[900px] flex flex-col rounded-2xl border-2 shadow-2xl overflow-hidden ${t(
                  'bg-[#1E2125] border-gray-700 text-gray-100',
                  'bg-white border-slate-300 text-slate-900',
                  'bg-white border-pink-300 text-pink-950',
                  'bg-[#10192A] border-[#253652] text-blue-50',
                  'bg-white border-emerald-300 text-emerald-950',
                  'bg-[#1F1714] border-[#3E2F2A] text-[#F5EBE6]',
                  'bg-white border-slate-300 text-slate-900'
                )}`}
                onClick={(e) => e.stopPropagation()}
              >
                {/* Шапка модального окна карты */}
                <div className={`p-3 sm:p-4 border-b flex flex-wrap items-center justify-between gap-2.5 ${t('border-gray-700 bg-[#282B30]', 'border-slate-200 bg-slate-50', 'border-pink-200 bg-pink-50', 'border-[#253652] bg-[#162032]', 'border-emerald-200 bg-emerald-50', 'border-[#3E2F2A] bg-[#241C19]', 'border-slate-200 bg-slate-50')}`}>
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🗺️</span>
                    <div>
                      <h3 className="text-sm sm:text-base font-black tracking-wide">
                        Карта маршрутов и пересечений
                      </h3>
                      <div className="text-[11px] opacity-75">
                        Маршрутизация по дорогам OSRM • OpenStreetMap
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={toggleAllExpertsVisibility}

            </div>

          <div className="max-w-[680px] mx-auto min-h-screen flex flex-col p-3 sm:p-4 pb-36 sm:pb-40">

                    <circle cx="12" cy="12" r="3"/>

                  appRole === 'dispatcher'

                <span>Диспетчер</span>
              </button>

            {appRole === 'dispatcher' && (

                {/* Верхняя строка панели: кнопка Карты и общее число точек */}

                    <span className="text-base sm:text-lg">🎛️</span>
                    <span className="font-black text-sm uppercase tracking-wide">

                  </div>

                  <button
                    type="button"

                    title="Открыть общую интерактивную карту пересечений маршрутов"

                    <span>🗺️</span>
                    <span>Карта пересечений</span>
                    <span className="bg-white/20 text-white px-2 py-0.5 rounded-full text-[11px] font-extrabold">

                    </span>
                  </button>
                </div>

                {/* Горизонтальный список вкладок экспертов */}

                    const count = exp.points ? exp.points.length : 0;
                    return (
                      <div
                        key={exp.id}
                        onClick={() => setActiveExpertId(exp.id)}
                        className={`flex items-center gap-2 px-3 py-2 rounded-xl border cursor-pointer flex-shrink-0 transition-all min-h-[44px] select-none ${
                          isActive
                            ? 'ring-2 ring-offset-1 ring-blue-500 shadow-md font-bold'
                            : 'opacity-70 hover:opacity-100 hover:shadow-sm'
                        } ${t('bg-[#1E2125] border-gray-700', 'bg-slate-50 border-slate-300', 'bg-pink-50 border-pink-200', 'bg-[#0B132B] border-[#253652]', 'bg-emerald-50 border-emerald-200', 'bg-[#16110F] border-[#3E2F2A]', 'bg-slate-50 border-slate-300')}`}
                        style={{
                          borderColor: isActive ? exp.color : undefined
                        }}
                      >
                        {/* Цветной кружок эксперта */}
                        <span
                          className="w-3.5 h-3.5 rounded-full flex-shrink-0 shadow-sm"
                          style={{ backgroundColor: exp.color }}
                        />
                        <span className="text-xs sm:text-sm whitespace-nowrap">{exp.name}</span>
                        <span
                          className="text-[11px] px-1.5 py-0.5 rounded-full font-mono font-bold"
                          style={{ backgroundColor: exp.color + '25', color: exp.color }}

                          {count}
                        </span>

                        {/* Кнопка закрытия вкладки (если экспертов > 1) */}
                        {dispatcherExperts.length > 1 && (
                          <button
                            type="button"
                            onClick={(e) => {
                              e.stopPropagation();
                              handleRemoveExpert(exp.id);
                            }}
                            className="w-6 h-6 rounded-full flex items-center justify-center opacity-50 hover:opacity-100 hover:bg-black/10 text-xs ml-0.5"
                            title={`Удалить вкладку ${exp.name}`}
                          >
                            ✕
                          </button>
                        )}
                      </div>
                    );
                  })}

                  {/* Кнопка добавления эксперта */}
                  <button
                    type="button"
                    onClick={handleAddExpert}
                    className={`min-h-[44px] px-3 py-2 rounded-xl border border-dashed flex items-center gap-1.5 text-xs sm:text-sm font-semibold flex-shrink-0 transition-all opacity-80 hover:opacity-100 ${t('border-gray-600 hover:bg-[#33363B]', 'border-slate-400 hover:bg-slate-100', 'border-pink-300 hover:bg-pink-100', 'border-blue-400/40 hover:bg-[#162238]', 'border-emerald-300 hover:bg-emerald-100', 'border-[#8D6E63] hover:bg-[#221A17]', 'border-slate-400 hover:bg-slate-100')}`}
                    title="Добавить ещё одного эксперта"
                  >
                    <span>+</span>
                    <span>Добавить</span>
                  </button>
                </div>

                {/* Редактирование имени текущего активного эксперта */}
                <div className={`mt-3 pt-3 border-t flex items-center gap-2 ${t('border-gray-700', 'border-slate-200', 'border-pink-200', 'border-[#253652]', 'border-emerald-200', 'border-[#3E2F2A]', 'border-slate-200')}`}>
                  <label className="text-xs font-semibold opacity-75 whitespace-nowrap flex items-center gap-1.5">

                    <span>Имя активной вкладки:</span>
